name: bite

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  bite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Only the test runner: Bite is installed on its own by the action, so the tests import each copy's code.
      - run: python -m pip install pytest
      # Post as the bite-check app (cat avatar) when its key is set; pull requests from forks get no secrets, so
      # they keep the built-in token.
      - id: app
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5545588
          private-key: ${{ secrets.BITE_APP_KEY }}
      - uses: ./
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
