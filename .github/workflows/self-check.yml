name: self-check

# Bite checks Bite: every Monday (and on Run workflow), Bite runs on this repo's own recent commits. When a change no
# test noticed turns up, bot/self_check.py opens an issue about it, and with ANTHROPIC_API_KEY set, a pull request
# with the missing test Bite wrote, which closes the issue. Each gap is reported once. Free when there's no gap;
# the test writing uses the key and stops at --budget.
on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      last:
        description: How many recent commits to check
        default: "20"

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency: self-check

jobs:
  self-check:
    if: github.repository == 'connabyss/bite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Only the test runner: Bite is installed on its own, so the tests import each copy's code.
      - run: |
          python -m pip install pytest
          pipx install .
      - name: Bite checks Bite
        env:
          LAST: ${{ inputs.last || '20' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pipx inject bite-check claude-agent-sdk > /dev/null
            ARGS="--write-tests --budget 0.50"
          fi
          bite --free --any --last "$LAST" --free-checks "$LAST" $ARGS
      - name: Open the issue and the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bot/self_check.py
