name: tests

on:
  push:
    branches: [main]
  pull_request:
  # bot/self_check.py starts it on the pull request it opens (GitHub doesn't start checks on those by itself).
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    # GitHub is short on Apple-chip Macs, so macos-latest jobs sit queued and get cancelled.
    # Run the Mac jobs on Intel Macs; the job names (and the required checks) stay the same.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15-intel' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[test]
      - run: python -m pytest -v
